<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Teachers' Day ❤️</title>

    <style>

        /* నీ existing CSS code ఇక్కడ ఉంటుంది */

        .teacher-section {
            padding: 70px 20px;
        }

        .teacher-photo {
            width: 230px;
            height: 230px;
            margin: 30px auto;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(
                135deg,
                #9b3158,
                #f3a6bd,
                #ffd166
            );
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        .teacher-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
        }

        .teacher-section h3 {
            font-size: 28px;
            color: #9b3158;
            margin-top: 20px;
        }

        .student-name {
            font-size: 22px;
            margin-top: 10px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <!-- నీ existing website code -->


    <!-- ⭐ TEACHER PHOTO SECTION ⭐ -->

    <section class="teacher-section">

        <h2>🌸 Our Wonderful Teacher 🌸</h2>

        <div class="teacher-photo">
            <img
                src="IMG-20260904-WA0021.jpg"
                alt="Our Teacher"
            >
        </div>

        <h3>
            From Your Student ❤️
        </h3>

        <p class="student-name">
            Your Name
        </p>

    </section>


    <!-- నీ existing footer -->

    <footer>
        Made with ❤️ and gratitude
        <br><br>
        <b>
            For a Teacher Who Will Always Be Remembered 🌷
        </b>
    </footer>

</body>
</html>
